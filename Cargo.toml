[package]
name    = "xitter-notify-server"
version = "0.1.0"
edition = "2024"
description = "Notification bridge for X/Twitter events over UnifiedPush"
license = "MIT"
repository = "https://github.com/amaanq/xitter-notify-server"
readme = "README.md"
keywords = [ "twitter", "x", "notifications", "unifiedpush" ]
categories = [ "web-programming" ]

[dependencies]
axum = {
	default-features = false,
	features = [
		"tokio",
		"json",
		"http1",
		"query",
	],
	version = "0.8",
}
bytes = "1"
http-body-util = "0.1"
hyper = { features = [ "client", "http1" ], version = "1.8" }
hyper-rustls = {
	default-features = false,
	features = [
		"http1",
		"tls12",
		"ring",
		"webpki-roots",
	],
	version = "0.27",
}
hyper-util = { features = [ "client-legacy", "http1", "tokio" ], version = "0.1" }
rusqlite = { features = [ "bundled" ], version = "0.38" }
rustls = { default-features = false, features = [ "ring", "std" ], version = "0.23" }
serde = { features = [ "derive" ], version = "1" }
serde_json = "1"
tokio = { features = [ "rt-multi-thread", "macros", "time", "sync", "signal" ], version = "1.49" }
xitter-txid = { default-features = false, version = "0.1" }

[lints.clippy]
cargo    = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

blanket_clippy_restriction_lints = "allow"
restriction                      = { level = "warn", priority = -1 }

arbitrary_source_item_ordering     = "allow"
arithmetic_side_effects            = "allow"
as_conversions                     = "allow"
doc_paragraphs_missing_punctuation = "allow"
else_if_without_else               = "allow"
error_impl_error                   = "allow"
exhaustive_enums                   = "allow"
exhaustive_structs                 = "allow"
expect_used                        = "allow"
implicit_return                    = "allow"
indexing_slicing                   = "allow"
integer_division                   = "allow"
integer_division_remainder_used    = "allow"
let_underscore_must_use            = "allow"
let_underscore_untyped             = "allow"
little_endian_bytes                = "allow"
map_err_ignore                     = "allow"
missing_asserts_for_indexing       = "allow"
missing_docs_in_private_items      = "allow"
missing_errors_doc                 = "allow"
missing_inline_in_public_items     = "allow"
missing_trait_methods              = "allow"
mod_module_files                   = "allow"
module_name_repetitions            = "allow"
multiple_crate_versions            = "allow"
must_use_candidate                 = "allow"
needless_borrowed_reference        = "allow"
print_stderr                       = "allow"
print_stdout                       = "allow"
pub_use                            = "allow"
pub_with_shorthand                 = "allow"
question_mark_used                 = "allow"
ref_patterns                       = "allow"
semicolon_outside_block            = "allow"
separated_literal_suffix           = "allow"
single_call_fn                     = "allow"
single_char_lifetime_names         = "allow"
std_instead_of_alloc               = "allow"
std_instead_of_core                = "allow"
tests_outside_test_module          = "allow"
unwrap_used                        = "allow"
